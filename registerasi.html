<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="register-container">
        <h1>Registrasi</h1><img src="Asset/logo.png" alt="Logo Perusahaan" class="logo">
        <form action="#">
            <label for="nama">Nama Lengkap: </label>
            <input type="text" name="nama" id="nama" placeholder="Masukkan Nama Lengkap">
            <label for="username">Username: </label>
            <input type="text" name="username" id="username" placeholder="Masukkan Username">
            <label for="email">Email: </label>
            <input type="email" id="email" name="email" placeholder="Masukkan Email">
            <label for="password">Password: </label>
            <input type="password" id="password" name="password" placeholder="Masukkan Password">
            <label for="konfirmasi-password">Konfirmasi Password: </label>
            <input type="password" id="konfirmasi-password" name="konfirmasi-password" placeholder="Masukkan Kembali Password">
            <label for="tanggal-lahir">Tanggal Lahir: </label>
            <input type="date" id="tanggal-lahir" name="tanggal-lahir">
            <label>Jenis Kelamin: </label>
            <input type="radio" id="laki-laki" name="jenis-kelamin" value="Laki-laki">
            <label for="laki-laki">Laki-laki</label>
            <input type="radio" id="perempuan" name="jenis-kelamin" value="Perempuan">
            <label for="perempuan">Perempuan</label>
            <label for="kelas">Kelas: </label>
            <select id="kelas" name="kelas">
                <option value="">-- Pilih Kelas --</option>
                <option value="XI PPLG 1">XI PPLG 1</option>
                <option value="XI PPLG 2">XI PPLG 2</option>
                <option value="XI PPLG 3">XI PPLG 3</option>
            </select>
            <p></p>
            <button type="submit">Daftar</button>
            <p>Sudah Memiliki Akun? <a href="index.html">Login Di Sini</a></p>
        </form>
    </div>
</body>
</html>>
